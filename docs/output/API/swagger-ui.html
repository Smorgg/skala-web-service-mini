<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전하처럼 API 문서</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
      }

      /* Swagger Editor의 코드 입력 영역 없이 API 문서만 전체 화면에 표시합니다. */
      #swagger-ui {
        max-width: 1200px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      // 이 HTML과 같은 폴더의 OpenAPI 명세를 개발용 문서 화면에 연결합니다.
      SwaggerUIBundle({
        url: "./openapi/trend-report.openapi.yaml",
        dom_id: "#swagger-ui",
        layout: "BaseLayout",
        deepLinking: true,
      });
    </script>
  </body>
</html>
